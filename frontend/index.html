<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliparr — Plex Clip Maker</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Cliparr <span>plex clip maker</span></h1>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search library..." autocomplete="off">
      <select id="sort-by">
        <option value="title">Sort: Title</option>
        <option value="year-desc">Sort: Year (new)</option>
        <option value="year-asc">Sort: Year (old)</option>
        <option value="duration-desc">Sort: Longest</option>
        <option value="duration-asc">Sort: Shortest</option>
        <option value="added-desc">Sort: Recently added</option>
      </select>
    </div>
  </div>
  <div class="now-playing-banner" id="now-playing" style="display:none">
    <div class="np-content">
      <span class="np-label">Now Playing</span>
      <span class="np-title" id="np-title"></span>
      <span class="np-time" id="np-time"></span>
      <button class="btn btn-small" id="btn-jump-clip">Jump to clip</button>
      <button class="btn btn-small btn-quick-clip" id="btn-quick-clip">Quick Clip 30s</button>
    </div>
    <div class="np-progress" id="np-progress" style="display:none">
      <div class="progress-bar">
        <div class="progress-fill" id="np-progress-fill"></div>
      </div>
      <div class="progress-text" id="np-progress-text">Clipping...</div>
    </div>
  </div>
</header>

<main id="main">

  <!-- Library grid (default view) -->
  <div id="library-view">
    <div class="results-header">
      Library
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="grid" id="library-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">&#127916;</div>
      <div class="empty-text">Nothing here yet</div>
      <div class="empty-sub">Add media to your Plex library and it will show up here.</div>
    </div>
  </div>

  <!-- Detail view (hidden until item selected) -->
  <div id="detail-view" style="display:none">
    <button class="btn btn-back" id="btn-back" onclick="goBack()">&larr; Back to Library</button>

    <div class="target-card">
      <div class="target-name" id="detail-title"></div>
      <div class="target-meta" id="detail-meta"></div>
    </div>

    <!-- Error banner -->
    <div class="error-banner" id="error-banner" style="display:none">
      <span id="error-message"></span>
    </div>

    <!-- Frame preview — instant, works anywhere in the movie -->
    <div id="frame-preview" style="display:none">
      <div class="frame-container">
        <img id="frame-img" src="" alt="Frame preview" />
        <div class="frame-overlay" id="frame-overlay">
          <div class="frame-loading">Loading frame...</div>
        </div>
      </div>
      <div class="frame-time">
        <span class="frame-time-label">Frame at</span>
        <span class="frame-time-value" id="frame-time-value">0:00</span>
        <span class="frame-time-sep">·</span>
        <span class="frame-time-hint">drag slider to scrub</span>
      </div>
    </div>

    <!-- Scrubber + Download (visible immediately) -->
    <div class="scrubber-section">
      <div class="scrubber-header">Select Clip Range</div>

      <div class="time-display">
        <span class="time-box" id="time-start">00:00</span>
        <span class="time-sep">&rarr;</span>
        <span class="time-box" id="time-end">00:30</span>
        <span class="time-dur" id="time-duration">/ 0:00</span>
      </div>

      <div class="range-sliders">
        <label class="range-label">
          Start
          <input type="range" id="range-start" min="0" max="100" value="0">
        </label>
        <label class="range-label">
          End
          <input type="range" id="range-end" min="0" max="100" value="30">
        </label>
      </div>

      <div class="preset-buttons">
        <button class="btn btn-small" onclick="handlePreset('shift-start',-10)">-10s</button>
        <button class="btn btn-small" onclick="handlePreset('shift-start',10)">+10s</button>
        <span class="preset-sep"></span>
        <button class="btn btn-small" onclick="handlePreset('set-duration',30)">30s clip</button>
        <button class="btn btn-small" onclick="handlePreset('set-duration',60)">1 min clip</button>
        <button class="btn btn-small" onclick="handlePreset('set-duration',120)">2 min clip</button>
      </div>

      <button class="btn btn-primary btn-download" id="btn-download-clip" disabled onclick="downloadClip()">
        &#11015; Download Clip
      </button>
      <div class="clip-progress" id="clip-progress" style="display:none">
        <div class="progress-bar">
          <div class="progress-fill" id="clip-progress-fill"></div>
        </div>
        <div class="progress-text" id="clip-progress-text">Encoding clip...</div>
      </div>
      <div class="clip-status" id="clip-status"></div>
    </div>
  </div>

</main>

<script src="static/app.js"></script>
</body>
</html>
