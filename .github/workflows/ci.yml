name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Syntax-check frontend JS
        run: |
          node --check frontend/static/app.js
          node --check frontend/static/mobile.js

  image:
    name: Dockerfile builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: scenester:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every failure that matters happens after a successful build: a CMD
      # pointing at the wrong module, static/ missing, ffmpeg absent from the
      # final layer. Build-only CI called all of those green.
      - name: Smoke-test the image
        run: |
          mkdir -p /tmp/clips /tmp/data
          # The image runs as uid 1000 (no root). A GitHub runner is uid 1001, so
          # dirs it creates are unwritable for the container: /data fails its
          # write probe, the app falls back to a temp cache, reports itself
          # unhealthy and the smoke test fails on a perfectly good build. The
          # production bind mounts are chowned to 1000 for exactly this reason.
          sudo chown -R 1000:1000 /tmp/clips /tmp/data
          docker run -d --name smoke -p 8096:8096 \
            -v /tmp/clips:/tmp/clips -v /tmp/data:/data scenester:ci
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8096/healthz; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container never became healthy:" >&2
          docker logs smoke >&2 || true
          exit 1

